<template>
    <section class="section" aria-labelledby="github-title">
        <div class="container grid">
            <div class="side">
                <h2 id="github-title" class="title">GitHub</h2>
                <p class="note">Fetched from the public GitHub API by Apex.</p>
            </div>

            <div class="body">
                <template lwc:if={isLoading}>
                    <div class="skeleton" role="status">
                        <span class="sr-only">Loading GitHub data</span>
                        <div class="sk sk-wide"></div>
                        <div class="sk sk-block"></div>
                        <div class="sk sk-wide"></div>
                    </div>
                </template>

                <template lwc:elseif={errorMessage}>
                    <div class="notice" role="status">
                        <p class="notice-title">Could not load GitHub data</p>
                        <p class="notice-text">{errorMessage}</p>
                        <div class="notice-actions">
                            <button class="btn btn-outline btn-sm" type="button" onclick={handleRetry}>
                                Try again
                            </button>
                            <a
                                class="link"
                                href={profileUrl}
                                target="_blank"
                                rel="noopener"
                            >
                                View profile on GitHub
                                <c-portfolio-icon name="external" size="sm"></c-portfolio-icon>
                            </a>
                        </div>
                    </div>
                </template>

                <template lwc:elseif={hasSnapshot}>
                    <div class="summary">
                        <div>
                            <p class="display-name">{displayName}</p>
                            <a
                                class="link handle"
                                href={snapshot.profileUrl}
                                target="_blank"
                                rel="noopener"
                            >
                                <c-portfolio-icon name="github" size="sm"></c-portfolio-icon>
                                {snapshot.username}
                            </a>
                            <p lwc:if={hasBio} class="bio">{snapshot.bio}</p>
                        </div>
                        <dl class="stats">
                            <div>
                                <dt>Public repositories</dt>
                                <dd>{snapshot.publicRepos}</dd>
                            </div>
                            <div>
                                <dt>Followers</dt>
                                <dd>{snapshot.followers}</dd>
                            </div>
                        </dl>
                    </div>

                    <div lwc:if={hasActivity} class="activity">
                        <h3 class="sub">Public activity, last 12 weeks</h3>
                        <div class="heat" role="img" aria-label={activitySummary}>
                            <template for:each={activityCells} for:item="cell">
                                <span key={cell.key} class={cell.className} title={cell.label}></span>
                            </template>
                        </div>
                        <p class="caption">
                            {snapshot.totalEvents} events from GitHub's public events feed. This is
                            a recent window, not the full contribution graph.
                        </p>
                    </div>

                    <div lwc:if={hasRepos} class="repos-wrap">
                        <h3 class="sub">Recently updated repositories</h3>
                        <ul class="repos">
                            <template for:each={repos} for:item="repo">
                                <li key={repo.key} class="repo">
                                    <a
                                        class="repo-name"
                                        href={repo.url}
                                        target="_blank"
                                        rel="noopener"
                                        >{repo.name}</a
                                    >
                                    <p lwc:if={repo.hasDescription} class="repo-desc">
                                        {repo.description}
                                    </p>
                                    <p class="repo-meta">
                                        <span lwc:if={repo.hasLanguage} class="meta-item"
                                            >{repo.language}</span
                                        >
                                        <span class="meta-item">
                                            <c-portfolio-icon name="star" size="sm"></c-portfolio-icon>
                                            {repo.stars}
                                        </span>
                                        <span class="meta-item">
                                            <c-portfolio-icon name="fork" size="sm"></c-portfolio-icon>
                                            {repo.forks}
                                        </span>
                                        <span class="meta-item">Updated {repo.updated}</span>
                                    </p>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </div>
    </section>
</template>
